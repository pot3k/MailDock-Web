<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>MailDock Web</title>
  <style>
    :root {
      color-scheme: light dark;
      --rail: #101b3a; --panel: #ffffff; --text: #101b3a; --muted: #5b6680; --line: #e3e7f0; --hover: #f4f6fb; --accent: #2a5fe8; --on-accent: #ffffff; --amber: #ffb020;
    }
    @media (prefers-color-scheme: dark) {
      :root { --panel: #141b2e; --text: #e8ecf6; --muted: #9aa5bf; --line: #26304a; --hover: #1c2540; --accent: #7da2ff; --on-accent: #101b3a; }
    }
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; overflow: hidden; }
    /* A Gmail view normally covers everything right of the 68px rail; the unified inbox shows there instead. */
    body { background: var(--rail); -webkit-app-region: drag; }
    #list { position: fixed; left: 0; top: 0; bottom: 0; width: 68px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 0; }
    body.mac #list { padding-top: 44px; }
    #list button {
      -webkit-app-region: no-drag; position: relative; width: 44px; height: 44px; border-radius: 12px;
      border: 2px solid transparent; background: rgba(255, 255, 255, 0.12); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    #list button:hover { background: rgba(255, 255, 255, 0.2); }
    #list button.active { border-color: var(--amber); background: rgba(255, 255, 255, 0.2); }
    .badge {
      position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box;
      border-radius: 9px; background: var(--amber); color: #101b3a; font-weight: 700; font-size: 11px; line-height: 18px; text-align: center;
    }
    #list #add { background: transparent; border: 2px dashed rgba(255, 255, 255, 0.35); color: rgba(255, 255, 255, 0.7); font-size: 22px; }
    #list #all { font-size: 20px; font-weight: 400; }
    #mark { display: block; width: 36px; height: 36px; margin: 0 auto 4px; -webkit-app-region: drag; }

    #inbox { position: fixed; left: 68px; top: 0; right: 0; bottom: 0; display: none; flex-direction: column; background: var(--panel); color: var(--text); -webkit-app-region: no-drag; }
    body.inbox-open #inbox { display: flex; }
    #inbox header { padding: 20px 28px 14px; border-bottom: 1px solid var(--line); }
    #inbox h1 { margin: 0; font-size: 20px; font-weight: 650; }
    #inbox header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    #rows { flex: 1; overflow-y: auto; }
    .row { position: relative; padding: 12px 28px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .row:hover { background: var(--hover); }
    .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .row .top { display: flex; gap: 12px; align-items: baseline; }
    .row .from { font-weight: 650; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .account { margin-left: auto; font-size: 12px; color: var(--accent); white-space: nowrap; }
    .row .time { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .row .subject { margin-top: 3px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .summary { margin-top: 2px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .actions { position: absolute; right: 24px; bottom: 10px; display: none; gap: 6px; }
    .row:hover .actions, .row:focus-within .actions { display: flex; }
    .row .actions button {
      padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-size: 12px; cursor: pointer;
    }
    .row .actions button:hover { border-color: var(--accent); color: var(--accent); }
    #empty { padding: 48px 28px; color: var(--muted); font-size: 14px; }

    /* App launcher: sits above the gear and opens upward. The rail scrolls if the window is too short for it. */
    #list { overflow-y: auto; scrollbar-width: none; }
    #list > * { flex: none; }
    #apps { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    #list #apps button { display: flex; align-items: center; justify-content: center; background: transparent; }
    #list #apps button:hover, #list #appsToggle.open { background: rgba(255, 255, 255, 0.2); }
    #list #apps .app { width: 38px; height: 38px; border-radius: 10px; background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.9); }
    #list #apps .app:hover { color: var(--amber); }
    #list #apps svg { display: block; pointer-events: none; }
    #list button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    #list #gear { background: transparent; font-size: 20px; font-weight: 400; }
    #list #gear:hover, #list #gear.active { background: rgba(255, 255, 255, 0.2); }
    #settings { position: fixed; left: 68px; top: 0; right: 0; bottom: 0; display: none; flex-direction: column; background: var(--panel); color: var(--text); -webkit-app-region: no-drag; }
    body.settings-open #settings { display: flex; }
    #settings header { padding: 20px 28px 14px; border-bottom: 1px solid var(--line); }
    #settings h1 { margin: 0; font-size: 20px; font-weight: 650; }
    #settings .body { flex: 1; display: flex; min-height: 0; }
    #settings nav { width: 190px; flex: none; padding: 14px 10px; border-right: 1px solid var(--line); background: var(--hover); display: flex; flex-direction: column; gap: 4px; }
    #settings nav button { padding: 9px 12px; border: 0; border-radius: 8px; background: none; color: var(--text); font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
    #settings nav button:hover { background: var(--line); }
    #settings nav button.active { background: var(--accent); color: var(--on-accent); font-weight: 600; }
    #settings .pane { flex: 1; overflow-y: auto; padding: 8px 28px 28px; }
    #settings h2 { margin: 16px 0 4px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .setting { display: flex; align-items: center; gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--line); max-width: 720px; }
    .setting .text { flex: 1; min-width: 0; }
    .setting .name { font-size: 14px; font-weight: 600; }
    .setting .desc { margin-top: 2px; font-size: 13px; color: var(--muted); }
    .setting .action { flex: none; min-width: 84px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
    .setting .action:hover { border-color: var(--accent); color: var(--accent); }
    .setting .action:disabled { opacity: 0.45; cursor: default; border-color: var(--line); color: var(--text); }
    .setting .action.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .setting.account { gap: 10px; }
    .setting.account .text { margin-left: 4px; }
    .setting.account .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .setting .avatar { flex: none; width: 34px; height: 34px; border-radius: 9px; background: var(--rail); color: #fff; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    .setting input[type='text'] { flex: 1; min-width: 0; margin-left: 4px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; font-size: 14px; }
    .setting input[type='text']:focus { outline: 2px solid var(--accent); outline-offset: 0; }
    .choice { flex: none; display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .choice button { padding: 7px 14px; border: 0; border-left: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
    .choice button:first-child { border-left: 0; }
    .choice button:hover { background: var(--hover); }
    .choice button[aria-pressed='true'] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
    .choice button:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }
    .setting.off .text, .setting.off .choice, .setting.off .timerange, .setting.off .switch { opacity: 0.5; }
    .switch:disabled { cursor: default; }
    #settings h3.subhead { margin: 22px 0 0; font-size: 14px; font-weight: 650; max-width: 720px; }
    .timerange { flex: none; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .timerange input[type='time'] { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; font-size: 13px; }
    .timerange input[type='time']:focus { outline: 2px solid var(--accent); outline-offset: 0; }
    .choice.days button { padding: 7px 10px; min-width: 44px; }
    .choice button:disabled { cursor: default; }
    .choice button:disabled:hover { background: var(--panel); }
    .choice button[aria-pressed='true']:disabled:hover { background: var(--accent); }
    .setting .value { flex: none; max-width: 55%; font-size: 13px; text-align: right; overflow-wrap: anywhere; user-select: text; cursor: text; }
    .switch { flex: none; position: relative; width: 42px; height: 24px; padding: 0; border: 0; border-radius: 12px; background: var(--muted); cursor: pointer; transition: background 0.15s; }
    .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
    .switch[aria-checked='true'] { background: var(--accent); }
    .switch[aria-checked='true']::after { transform: translateX(18px); }
    .switch:focus-visible, .setting .action:focus-visible, #settings nav button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    .setting.sound { gap: 12px; padding: 0; }
    .setting.sound .pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 12px 0; border: 0; background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
    .setting.sound .pick .name, .setting.sound .pick .desc { display: block; }
    .setting.sound .dot { flex: none; width: 18px; height: 18px; box-sizing: border-box; border: 2px solid var(--muted); border-radius: 50%; }
    .setting.sound .pick:hover .dot { border-color: var(--accent); }
    .setting.sound .pick[aria-pressed='true'] .dot { border: 6px solid var(--accent); }
    .setting.sound .pick[aria-pressed='true'] .name { color: var(--accent); }
    .setting.sound .pick:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="list"></div>
  <section id="inbox">
    <header>
      <h1>All Inboxes</h1>
      <p id="inbox-note"></p>
    </header>
    <div id="rows"></div>
  </section>
  <section id="settings">
    <header><h1>Settings</h1></header>
    <div class="body">
      <nav id="settings-nav"></nav>
      <div class="pane" id="settings-pane"></div>
    </div>
  </section>
  <script>
    if (/Mac/.test(navigator.platform)) document.body.classList.add('mac');
    const IS_WINDOWS = /^Win/.test(navigator.platform);
    const list = document.getElementById('list');
    const rows = document.getElementById('rows');
    const note = document.getElementById('inbox-note');
    const ACTIONS = [['archive', 'Archive'], ['markRead', 'Mark as read'], ['delete', 'Delete'], ['spam', 'Spam']];

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    // App launcher icons. These are MailDock's own line drawings in the sidebar's colours, on purpose:
    // the app must not carry Google's logos or brand colours. Names match Gmail > Google Apps in the menu.
    const icon = (shape) => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${shape}</svg>`;
    const GRID = [5, 12, 19].flatMap((y) => [5, 12, 19].map((x) => `<circle cx="${x}" cy="${y}" r="1.7" fill="currentColor" stroke="none"/>`)).join('');
    const APPS = [
      ['Calendar', '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'],
      ['Drive', '<path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>'],
      ['Meet', '<rect x="3" y="6.5" width="12" height="11" rx="2"/><path d="M15 10.5l6-3.5v10l-6-3.5z"/>'],
      ['Contacts', '<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.5 3.6-5.5 7-5.5s6.2 2 7 5.5"/>'],
      ['Keep', '<path d="M9.5 18h5M10.5 21h3M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>'],
      ['Docs', '<path d="M7 3.5h7l4 4V19a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5z"/><path d="M14 3.5V8h4M9 12h6M9 15.5h6"/>'],
    ];
    let appsOpen = false;
    try {
      appsOpen = localStorage.getItem('appsOpen') === '1';
    } catch {
      /* starts closed */
    }

    function formatTime(ms) {
      const d = new Date(ms);
      const today = new Date().toDateString() === d.toDateString();
      return today ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    function render(state) {
      list.textContent = '';
      const mark = document.createElement('img');
      mark.id = 'mark';
      mark.src = 'icon.png';
      mark.alt = 'MailDock';
      list.appendChild(mark);

      const all = el('button', state.inboxOpen ? 'active' : '', '✉');
      all.id = 'all';
      all.title = 'All inboxes: unread mail from every account';
      all.onclick = () => window.mailbox.toggleInbox();
      list.appendChild(all);

      for (const a of state.accounts) {
        const b = document.createElement('button');
        b.textContent = (a.name[0] || '?').toUpperCase();
        b.title = `${a.name}\nDouble-click to rename, right-click to remove (or use Settings > Accounts)`;
        if (a.id === state.activeId && !state.inboxOpen && !state.settingsOpen) b.className = 'active';
        if (a.unread > 0) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = a.unread > 99 ? '99+' : a.unread;
          b.appendChild(badge);
        }
        b.onclick = () => window.mailbox.select(a.id);
        // Electron has no prompt(), so renaming happens in Settings > Accounts.
        b.ondblclick = () => openAccountEditor(lastState || state, a);
        b.oncontextmenu = (e) => {
          e.preventDefault();
          if (confirm(`Remove "${a.name}" from this app? You will be signed out of it.`)) window.mailbox.remove(a.id);
        };
        list.appendChild(b);
      }
      const add = document.createElement('button');
      add.id = 'add';
      add.textContent = '+';
      add.title = 'Add account';
      add.onclick = () => window.mailbox.add();
      list.appendChild(add);

      const apps = el('div');
      apps.id = 'apps';
      if (appsOpen) {
        for (const [name, shape] of APPS) {
          const b = el('button', 'app');
          b.innerHTML = icon(shape);
          b.title = `Google ${name}`;
          b.setAttribute('aria-label', `Open Google ${name} in a new window`);
          b.onclick = () => window.mailbox.openApp(name);
          apps.appendChild(b);
        }
      }
      const toggle = el('button', appsOpen ? 'open' : '');
      toggle.id = 'appsToggle';
      toggle.innerHTML = icon(GRID);
      toggle.title = appsOpen ? 'Hide Google apps' : 'Google apps';
      toggle.setAttribute('aria-label', 'Google apps');
      toggle.setAttribute('aria-expanded', String(appsOpen));
      toggle.onclick = () => {
        appsOpen = !appsOpen;
        try {
          localStorage.setItem('appsOpen', appsOpen ? '1' : '');
        } catch {
          /* just not remembered */
        }
        render(state);
        document.getElementById('appsToggle').focus();
      };
      apps.appendChild(toggle);
      list.appendChild(apps);

      const gear = el('button', state.settingsOpen ? 'active' : '', '⚙');
      gear.id = 'gear';
      gear.title = 'Settings';
      gear.onclick = () => window.mailbox.toggleSettings();
      list.appendChild(gear);

      renderInbox(state);
      renderSettings(state);
    }

    // Settings page: sections in the side menu. An item with `key` is an on/off toggle;
    // an item with `run` is a one-off action, so it gets a button instead.
    const SETTINGS = [
      {
        id: 'general',
        title: 'General',
        items: [
          { name: 'Launch at Login', desc: 'Start MailDock Web when you sign in to this computer.', key: 'launchAtLogin' },
          { name: 'Minimize to System Tray', desc: 'Minimizing hides the window in the system tray instead of leaving it on the taskbar. Needs the system tray icon.', key: 'minimizeToTray' },
          { name: 'Show Unread Badge on Taskbar Icon', desc: 'Show the number of unread emails, across all accounts, on the MailDock Web icon in the taskbar.', key: 'taskbarBadge' },
          {
            name: 'Default Mail Client',
            desc: 'Make MailDock Web the app that opens email links. Windows only lets you change this yourself: in the Settings page that opens, click MAILTO and choose MailDock Web.',
            button: 'Windows Settings',
            run: () => window.mailbox.settingsAction('defaultMailClient'),
            windowsOnly: true, // other systems choose the email app elsewhere
          },
        ],
      },
      { id: 'accounts', title: 'Accounts', custom: renderAccountSettings },
      {
        id: 'notifications',
        title: 'Notifications',
        items: [
          { name: 'New Emails', desc: "Show a desktop notification when new mail arrives in any account. When off, no new-mail notifications are shown.", key: 'notifications' },
          {
            name: 'Notify',
            desc: "Which new emails get a notification. Important is the label Gmail gives by itself; if Gmail's importance markers are turned off, choose All New Emails.",
            key: 'notifyMode',
            options: [['all', 'All New Emails'], ['important', 'Only Important Emails']],
            // Only matters while New Emails is on.
            disabled: (s) => !s.settings.notifications,
          },
          { render: renderNotifyTimes },
          { render: renderSoundSettings },
          {
            name: 'Test Notification',
            desc: 'Show a sample notification now, whatever the settings above say. If none appears, check Windows notification settings and Do Not Disturb.',
            button: 'Test',
            run: () => window.mailbox.settingsAction('testNotification'),
          },
        ],
      },
      {
        id: 'appearance',
        title: 'Appearance',
        items: [
          {
            name: 'Theme',
            desc: 'Colours for MailDock Web itself. Gmail keeps the theme chosen in its own settings.',
            key: 'theme',
            options: [['system', 'System'], ['dark', 'Dark'], ['light', 'Light']],
          },
          { name: 'Enable System Tray Icon', desc: 'Show MailDock Web in the system tray. When off, closing the window minimizes it to the taskbar instead.', key: 'trayIcon' },
          { name: 'Show Unread Badges', desc: 'Show unread counts on the account buttons in the sidebar. The taskbar icon has its own switch under General.', key: 'unreadBadges' },
          { name: 'Edit Custom CSS', desc: 'Open custom.css in your editor. It is applied to Gmail in every account, and saving it applies the changes.', button: 'Open', run: () => window.mailbox.settingsAction('editCss') },
          { name: 'Reload Custom CSS', desc: 'Apply custom.css again now.', button: 'Reload', run: () => window.mailbox.settingsAction('reloadCss') },
        ],
      },
      {
        id: 'about',
        title: 'About',
        items: [
          { name: 'Application Version', desc: 'The version of MailDock Web you are running.', value: (s) => s.about.version },
          { name: 'Operating System', desc: 'The system this computer is running.', value: (s) => s.about.os },
          { name: 'Device ID', desc: 'A random ID made for this installation. It is stored only on this computer and appears in exported logs.', value: (s) => s.about.deviceId },
        ],
      },
      {
        id: 'logs',
        title: 'Logs',
        items: [
          { name: 'Export Logs', desc: 'Save a text file of what the app did and what went wrong, to send with a problem report. It never includes message content, senders or email addresses.', button: 'Export', run: () => window.mailbox.settingsAction('exportLogs') },
        ],
      },
    ];
    let settingsSection = 'general';
    let lastState = null;

    function renderSettings(state) {
      lastState = state;
      document.body.classList.toggle('settings-open', state.settingsOpen);
      if (!state.settingsOpen) return;
      // A redraw would wipe a time that is half typed (they come with every unread-count change),
      // so wait until the box loses focus; its blur handler redraws.
      if (document.activeElement?.matches?.("#settings input[type='time']")) return;
      // Redrawing drops keyboard focus, so remember which control had it.
      const focused = document.activeElement?.dataset?.focusKey;
      const nav = document.getElementById('settings-nav');
      const pane = document.getElementById('settings-pane');
      nav.textContent = '';
      pane.textContent = '';
      for (const section of SETTINGS) {
        const b = el('button', section.id === settingsSection ? 'active' : '', section.title);
        b.dataset.focusKey = `nav:${section.id}`;
        b.onclick = () => {
          settingsSection = section.id;
          renderSettings(lastState);
        };
        nav.appendChild(b);
      }
      const section = SETTINGS.find((s) => s.id === settingsSection);
      pane.appendChild(el('h2', '', section.title));
      if (section.custom) section.custom(state, pane);
      for (const item of section.items || []) {
        if (item.windowsOnly && !IS_WINDOWS) continue;
        if (item.render) {
          item.render(state, pane);
          continue;
        }
        const row = el('div', 'setting');
        const text = el('div', 'text');
        text.appendChild(el('div', 'name', item.name));
        text.appendChild(el('div', 'desc', item.desc));
        row.appendChild(text);
        if (item.value) {
          // Read-only information: plain selectable text, nothing to click.
          row.appendChild(el('div', 'value', item.value(state)));
          pane.appendChild(row);
          continue;
        }
        if (item.options) {
          // One of several: a row of buttons with the current choice pressed.
          const group = el('div', 'choice');
          group.setAttribute('role', 'group');
          group.setAttribute('aria-label', item.name);
          const off = Boolean(item.disabled?.(state));
          if (off) row.classList.add('off');
          for (const [value, label] of item.options) {
            const b = el('button', '', label);
            b.disabled = off;
            b.setAttribute('aria-pressed', String(state.settings[item.key] === value));
            b.dataset.focusKey = `item:${item.name}:${value}`;
            b.onclick = () => window.mailbox.setSetting(item.key, value);
            group.appendChild(b);
          }
          row.appendChild(group);
          pane.appendChild(row);
          continue;
        }
        let control;
        if (item.key) {
          const on = Boolean(state.settings[item.key]);
          control = el('button', 'switch');
          control.setAttribute('role', 'switch');
          control.setAttribute('aria-checked', String(on));
          control.setAttribute('aria-label', item.name);
          control.onclick = () => window.mailbox.setSetting(item.key, !on);
        } else {
          control = el('button', 'action', item.button);
          control.setAttribute('aria-label', item.name);
          control.onclick = item.run;
        }
        control.dataset.focusKey = `item:${item.name}`;
        row.appendChild(control);
        pane.appendChild(row);
      }
      if (focused) [...document.querySelectorAll('#settings [data-focus-key]')].find((n) => n.dataset.focusKey === focused)?.focus();
    }

    // Notification times: an on/off switch, a From–To time and the days of the week.
    const DAYS = [[0, 'Sun'], [1, 'Mon'], [2, 'Tue'], [3, 'Wed'], [4, 'Thu'], [5, 'Fri'], [6, 'Sat']];

    function renderNotifyTimes(state, pane) {
      const t = state.settings.notifyTimes;
      const save = (change) => window.mailbox.setSetting('notifyTimes', { ...t, ...change });
      const allOff = !state.settings.notifications; // nothing to schedule while New Emails is off
      const timesOff = allOff || !t.enabled;
      const row = (name, desc, off) => {
        const r = el('div', 'setting' + (off ? ' off' : ''));
        const text = el('div', 'text');
        text.appendChild(el('div', 'name', name));
        text.appendChild(el('div', 'desc', desc));
        r.appendChild(text);
        return r;
      };

      pane.appendChild(el('h3', 'subhead', 'Notification Times'));

      const limit = row('Only at Set Times', 'Show notifications only on the days and between the times below. Mail that arrives outside them is still counted and listed in All Inboxes.', allOff);
      const sw = el('button', 'switch');
      sw.setAttribute('role', 'switch');
      sw.setAttribute('aria-checked', String(t.enabled));
      sw.setAttribute('aria-label', 'Only at Set Times');
      sw.disabled = allOff;
      sw.dataset.focusKey = 'times:enabled';
      sw.onclick = () => save({ enabled: !t.enabled });
      limit.appendChild(sw);
      pane.appendChild(limit);

      const time = row('Time', 'From the first time until the second. If the second is earlier, the period runs past midnight; the same time twice means all day.', timesOff);
      const range = el('div', 'timerange');
      const box = (key, label) => {
        const input = el('input');
        input.type = 'time';
        input.value = t[key];
        input.disabled = timesOff;
        input.setAttribute('aria-label', label);
        input.dataset.focusKey = `times:${key}`;
        // 'change' fires once a complete time is entered; an emptied box is ignored.
        input.onchange = () => input.value && save({ [key]: input.value });
        input.onblur = () => setTimeout(() => renderSettings(lastState), 0);
        return input;
      };
      range.append(box('from', 'From'), el('span', '', 'to'), box('to', 'To'));
      time.appendChild(range);
      pane.appendChild(time);

      const days = row('Days', t.enabled && !t.days.length ? 'No days are chosen, so no new-mail notifications will be shown.' : 'The days of the week to show notifications on.', timesOff);
      const group = el('div', 'choice days');
      group.setAttribute('role', 'group');
      group.setAttribute('aria-label', 'Days');
      for (const [n, label] of DAYS) {
        const b = el('button', '', label);
        const on = t.days.includes(n);
        b.disabled = timesOff;
        b.setAttribute('aria-pressed', String(on));
        b.dataset.focusKey = `times:day:${n}`;
        b.onclick = () => save({ days: on ? t.days.filter((d) => d !== n) : [...t.days, n] });
        group.appendChild(b);
      }
      days.appendChild(group);
      pane.appendChild(days);
    }

    // Notifications > Sound: the system's own sound, no sound, or one of the app's sounds. Choosing a
    // sound plays it once; Play only listens, so sounds can be compared without changing the choice.
    const SYSTEM_SOUND = IS_WINDOWS ? 'Windows Default' : 'System Default';

    function renderSoundSettings(state, pane) {
      const current = state.settings.notifySound;
      pane.appendChild(el('h3', 'subhead', 'Sound'));
      const intro = el('div', 'setting');
      const text = el('div', 'text');
      text.appendChild(el('div', 'name', 'Notification Sound'));
      text.appendChild(el('div', 'desc', 'Played when MailDock Web shows a notification. Click a sound to use it, or Play to listen first.'));
      intro.appendChild(text);
      pane.appendChild(intro);

      const list = el('div', 'sounds');
      list.setAttribute('role', 'group');
      list.setAttribute('aria-label', 'Notification Sound');
      const choices = [
        { id: 'default', name: SYSTEM_SOUND, desc: 'The notification sound set in your system settings.' },
        { id: 'none', name: 'No Sound', desc: 'Notifications appear without a sound.' },
        ...state.sounds,
      ];
      for (const c of choices) {
        const row = el('div', 'setting sound');
        const pick = el('button', 'pick');
        pick.setAttribute('aria-pressed', String(current === c.id));
        pick.dataset.focusKey = `sound:${c.id}`;
        pick.appendChild(el('span', 'dot'));
        const label = el('span', 'text');
        label.appendChild(el('span', 'name', c.name));
        if (c.desc) label.appendChild(el('span', 'desc', c.desc));
        pick.appendChild(label);
        pick.onclick = () => {
          if (c.file) playSound(c.file);
          if (current !== c.id) window.mailbox.setSetting('notifySound', c.id);
        };
        row.appendChild(pick);
        if (c.file) {
          const play = el('button', 'action', 'Play');
          play.setAttribute('aria-label', `Play ${c.name}`);
          play.dataset.focusKey = `sound:play:${c.id}`;
          play.onclick = () => playSound(c.file);
          row.appendChild(play);
        }
        list.appendChild(row);
      }
      pane.appendChild(list);
    }

    // Notification sounds (sent by main when a notification shows) and previews. One at a time:
    // a new sound stops the one before. Only files main listed in the state are played.
    let audio = null;
    function playSound(file) {
      if (!lastState?.sounds?.some((s) => s.file === file)) return;
      audio?.pause();
      audio = new Audio(`sounds/${encodeURIComponent(file)}`);
      audio.play().catch(() => {});
    }

    // Accounts section: every account with Edit (rename) and Remove, then Add Account.
    // `editing` survives redraws, which happen whenever an unread count changes.
    let editing = null; // { id, value }

    function openAccountEditor(state, account) {
      settingsSection = 'accounts';
      editing = { id: account.id, value: account.name };
      if (state.settingsOpen) renderSettings(state);
      else window.mailbox.toggleSettings();
    }

    function renderAccountSettings(state, pane) {
      if (editing && !state.accounts.some((a) => a.id === editing.id)) editing = null;
      for (const a of state.accounts) {
        const row = el('div', 'setting account');
        row.appendChild(el('div', 'avatar', (a.name[0] || '?').toUpperCase()));
        if (editing?.id === a.id) {
          const input = el('input');
          input.type = 'text';
          input.maxLength = 40;
          input.value = editing.value;
          input.setAttribute('aria-label', 'Account name');
          input.dataset.focusKey = `edit:${a.id}`;
          input.oninput = () => (editing.value = input.value);
          const save = () => {
            const name = editing.value.trim();
            editing = null;
            if (name && name !== a.name) window.mailbox.rename(a.id, name);
            else renderSettings(lastState);
          };
          const cancel = () => {
            editing = null;
            renderSettings(lastState);
          };
          input.onkeydown = (e) => {
            if (e.key === 'Enter') save();
            else if (e.key === 'Escape') cancel();
          };
          row.appendChild(input);
          const saveBtn = el('button', 'action primary', 'Save');
          saveBtn.dataset.focusKey = `save:${a.id}`;
          saveBtn.onclick = save;
          const cancelBtn = el('button', 'action', 'Cancel');
          cancelBtn.dataset.focusKey = `cancel:${a.id}`;
          cancelBtn.onclick = cancel;
          row.append(saveBtn, cancelBtn);
          // Put the cursor in the box when editing starts.
          setTimeout(() => {
            if (document.activeElement !== input && !document.activeElement?.dataset?.focusKey) input.focus();
          }, 0);
        } else {
          const text = el('div', 'text');
          text.appendChild(el('div', 'name', a.name));
          row.appendChild(text);
          const edit = el('button', 'action', 'Edit');
          edit.setAttribute('aria-label', `Rename ${a.name}`);
          edit.dataset.focusKey = `edit:${a.id}`;
          edit.onclick = () => openAccountEditor(lastState, a);
          const remove = el('button', 'action', 'Remove');
          remove.setAttribute('aria-label', `Remove ${a.name}`);
          remove.dataset.focusKey = `remove:${a.id}`;
          // The app always keeps one account, so the last one cannot be removed.
          remove.disabled = state.accounts.length <= 1;
          if (remove.disabled) remove.title = 'Add another account before removing this one.';
          remove.onclick = () => {
            if (confirm(`Remove "${a.name}" from this app? You will be signed out of it.`)) window.mailbox.remove(a.id);
          };
          row.append(edit, remove);
        }
        pane.appendChild(row);
      }
      const add = el('div', 'setting');
      const text = el('div', 'text');
      text.appendChild(el('div', 'name', 'Add Account'));
      text.appendChild(el('div', 'desc', 'Sign in to another Gmail account. Each account keeps its own separate session.'));
      const addBtn = el('button', 'action', 'Add');
      addBtn.setAttribute('aria-label', 'Add Account');
      addBtn.dataset.focusKey = 'accounts:add';
      addBtn.onclick = () => window.mailbox.add();
      add.append(text, addBtn);
      pane.appendChild(add);
    }

    function renderInbox(state) {
      document.body.classList.toggle('inbox-open', state.inboxOpen);
      if (!state.inboxOpen) return;
      const many = state.accounts.length > 1;
      note.textContent = many ? `Unread inbox mail across ${state.accounts.length} accounts` : 'Unread inbox mail';
      rows.textContent = '';
      if (state.inbox.length === 0) {
        rows.appendChild(el('div', '', 'No unread mail. Accounts that are not signed in yet do not appear here.')).id = 'empty';
        return;
      }
      for (const m of state.inbox) {
        const row = el('div', 'row');
        row.tabIndex = 0;
        const top = el('div', 'top');
        top.appendChild(el('span', 'from', m.from));
        if (many) top.appendChild(el('span', 'account', m.account));
        const time = el('span', 'time', formatTime(m.receivedAt));
        if (!many) time.style.marginLeft = 'auto';
        top.appendChild(time);
        row.appendChild(top);
        row.appendChild(el('div', 'subject', m.subject));
        if (m.summary) row.appendChild(el('div', 'summary', m.summary));
        const actions = el('div', 'actions');
        for (const [action, label] of ACTIONS) {
          const b = el('button', '', label);
          b.onclick = (e) => {
            e.stopPropagation();
            window.mailbox.mailAction(m.accountId, m.messageId, action);
          };
          actions.appendChild(b);
        }
        row.appendChild(actions);
        const open = () => window.mailbox.openMessage(m.accountId, m.messageId);
        row.onclick = open;
        row.onkeydown = (e) => {
          if (e.key === 'Enter' && e.target === row) open();
        };
        rows.appendChild(row);
      }
    }

    // Windows taskbar overlay: draw an amber badge with the total unread count and hand it to the main process.
    function drawOverlay(total) {
      if (!total) return window.mailbox.setOverlay(null, 0);
      const c = document.createElement('canvas');
      c.width = c.height = 32;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffb020';
      ctx.beginPath();
      ctx.arc(16, 16, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#101b3a';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(total > 99 ? '99+' : String(total), 16, 17);
      window.mailbox.setOverlay(c.toDataURL('image/png'), total);
    }

    let lastTotal = -1;
    function handle(state) {
      render(state);
      if (state.total !== lastTotal) {
        lastTotal = state.total;
        drawOverlay(state.total);
      }
    }

    window.mailbox.getState().then(handle);
    window.mailbox.onState(handle);
    window.mailbox.onPlaySound(playSound);
  </script>
</body>
</html>
