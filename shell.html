<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>MailDock Web</title>
  <style>
    :root {
      color-scheme: light dark;
      --rail: #101b3a; --panel: #ffffff; --text: #101b3a; --muted: #5b6680; --line: #e3e7f0; --hover: #f4f6fb; --accent: #2a5fe8; --on-accent: #ffffff; --amber: #ffb020;
    }
    @media (prefers-color-scheme: dark) {
      :root { --panel: #141b2e; --text: #e8ecf6; --muted: #9aa5bf; --line: #26304a; --hover: #1c2540; --accent: #7da2ff; --on-accent: #101b3a; }
    }
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; overflow: hidden; }
    /* A Gmail view normally covers everything right of the 68px rail; the unified inbox shows there instead. */
    body { background: var(--rail); -webkit-app-region: drag; }
    #list { position: fixed; left: 0; top: 0; bottom: 0; width: 68px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 0; }
    body.mac #list { padding-top: 44px; }
    #list button {
      -webkit-app-region: no-drag; position: relative; width: 44px; height: 44px; border-radius: 12px;
      border: 2px solid transparent; background: rgba(255, 255, 255, 0.12); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    #list button:hover { background: rgba(255, 255, 255, 0.2); }
    #list button.active { border-color: var(--amber); background: rgba(255, 255, 255, 0.2); }
    .badge {
      position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box;
      border-radius: 9px; background: var(--amber); color: #101b3a; font-weight: 700; font-size: 11px; line-height: 18px; text-align: center;
    }
    #list #add { background: transparent; border: 2px dashed rgba(255, 255, 255, 0.35); color: rgba(255, 255, 255, 0.7); font-size: 22px; }
    #list #all { font-size: 20px; font-weight: 400; }
    #mark { display: block; width: 36px; height: 36px; margin: 0 auto 4px; -webkit-app-region: drag; }

    #inbox { position: fixed; left: 68px; top: 0; right: 0; bottom: 0; display: none; flex-direction: column; background: var(--panel); color: var(--text); -webkit-app-region: no-drag; }
    body.inbox-open #inbox { display: flex; }
    #inbox header { padding: 20px 28px 14px; border-bottom: 1px solid var(--line); }
    #inbox h1 { margin: 0; font-size: 20px; font-weight: 650; }
    #inbox header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    #rows { flex: 1; overflow-y: auto; }
    .row { position: relative; padding: 12px 28px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .row:hover { background: var(--hover); }
    .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .row .top { display: flex; gap: 12px; align-items: baseline; }
    .row .from { font-weight: 650; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .account { margin-left: auto; font-size: 12px; color: var(--accent); white-space: nowrap; }
    .row .time { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .row .subject { margin-top: 3px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .summary { margin-top: 2px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .actions { position: absolute; right: 24px; bottom: 10px; display: none; gap: 6px; }
    .row:hover .actions, .row:focus-within .actions { display: flex; }
    .row .actions button {
      padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-size: 12px; cursor: pointer;
    }
    .row .actions button:hover { border-color: var(--accent); color: var(--accent); }
    #empty { padding: 48px 28px; color: var(--muted); font-size: 14px; }

    #list #gear { margin-top: auto; background: transparent; font-size: 20px; font-weight: 400; }
    #list #gear:hover, #list #gear.active { background: rgba(255, 255, 255, 0.2); }
    #settings { position: fixed; left: 68px; top: 0; right: 0; bottom: 0; display: none; flex-direction: column; background: var(--panel); color: var(--text); -webkit-app-region: no-drag; }
    body.settings-open #settings { display: flex; }
    #settings header { padding: 20px 28px 14px; border-bottom: 1px solid var(--line); }
    #settings h1 { margin: 0; font-size: 20px; font-weight: 650; }
    #settings .body { flex: 1; display: flex; min-height: 0; }
    #settings nav { width: 190px; flex: none; padding: 14px 10px; border-right: 1px solid var(--line); background: var(--hover); display: flex; flex-direction: column; gap: 4px; }
    #settings nav button { padding: 9px 12px; border: 0; border-radius: 8px; background: none; color: var(--text); font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
    #settings nav button:hover { background: var(--line); }
    #settings nav button.active { background: var(--accent); color: var(--on-accent); font-weight: 600; }
    #settings .pane { flex: 1; overflow-y: auto; padding: 8px 28px 28px; }
    #settings h2 { margin: 16px 0 4px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .setting { display: flex; align-items: center; gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--line); max-width: 720px; }
    .setting .text { flex: 1; min-width: 0; }
    .setting .name { font-size: 14px; font-weight: 600; }
    .setting .desc { margin-top: 2px; font-size: 13px; color: var(--muted); }
    .setting .action { flex: none; min-width: 84px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
    .setting .action:hover { border-color: var(--accent); color: var(--accent); }
    .switch { flex: none; position: relative; width: 42px; height: 24px; padding: 0; border: 0; border-radius: 12px; background: var(--muted); cursor: pointer; transition: background 0.15s; }
    .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
    .switch[aria-checked='true'] { background: var(--accent); }
    .switch[aria-checked='true']::after { transform: translateX(18px); }
    .switch:focus-visible, .setting .action:focus-visible, #settings nav button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="list"></div>
  <section id="inbox">
    <header>
      <h1>All Inboxes</h1>
      <p id="inbox-note"></p>
    </header>
    <div id="rows"></div>
  </section>
  <section id="settings">
    <header><h1>Settings</h1></header>
    <div class="body">
      <nav id="settings-nav"></nav>
      <div class="pane" id="settings-pane"></div>
    </div>
  </section>
  <script>
    if (/Mac/.test(navigator.platform)) document.body.classList.add('mac');
    const list = document.getElementById('list');
    const rows = document.getElementById('rows');
    const note = document.getElementById('inbox-note');
    const ACTIONS = [['archive', 'Archive'], ['markRead', 'Mark as read'], ['delete', 'Delete'], ['spam', 'Spam']];

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function formatTime(ms) {
      const d = new Date(ms);
      const today = new Date().toDateString() === d.toDateString();
      return today ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    function render(state) {
      list.textContent = '';
      const mark = document.createElement('img');
      mark.id = 'mark';
      mark.src = 'icon.png';
      mark.alt = 'MailDock';
      list.appendChild(mark);

      const all = el('button', state.inboxOpen ? 'active' : '', '✉');
      all.id = 'all';
      all.title = 'All inboxes: unread mail from every account';
      all.onclick = () => window.mailbox.toggleInbox();
      list.appendChild(all);

      for (const a of state.accounts) {
        const b = document.createElement('button');
        b.textContent = (a.name[0] || '?').toUpperCase();
        b.title = `${a.name}\nDouble-click to rename, right-click to remove`;
        if (a.id === state.activeId && !state.inboxOpen && !state.settingsOpen) b.className = 'active';
        if (a.unread > 0) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = a.unread > 99 ? '99+' : a.unread;
          b.appendChild(badge);
        }
        b.onclick = () => window.mailbox.select(a.id);
        b.ondblclick = () => {
          const name = prompt('Account name', a.name);
          if (name) window.mailbox.rename(a.id, name);
        };
        b.oncontextmenu = (e) => {
          e.preventDefault();
          if (confirm(`Remove "${a.name}" from this app? You will be signed out of it.`)) window.mailbox.remove(a.id);
        };
        list.appendChild(b);
      }
      const add = document.createElement('button');
      add.id = 'add';
      add.textContent = '+';
      add.title = 'Add account';
      add.onclick = () => window.mailbox.add();
      list.appendChild(add);

      const gear = el('button', state.settingsOpen ? 'active' : '', '⚙');
      gear.id = 'gear';
      gear.title = 'Settings';
      gear.onclick = () => window.mailbox.toggleSettings();
      list.appendChild(gear);

      renderInbox(state);
      renderSettings(state);
    }

    // Settings page: sections in the side menu. An item with `key` is an on/off toggle;
    // an item with `run` is a one-off action, so it gets a button instead.
    const SETTINGS = [
      {
        id: 'general',
        title: 'General',
        items: [
          { name: 'Add Account', desc: 'Sign in to another Gmail account. Each account keeps its own separate session.', button: 'Add', run: () => window.mailbox.add() },
          { name: 'Launch at Login', desc: 'Start MailDock Web when you sign in to this computer.', key: 'launchAtLogin' },
          { name: 'Minimize to System Tray', desc: 'Minimizing hides the window in the system tray instead of leaving it on the taskbar.', key: 'minimizeToTray' },
        ],
      },
      {
        id: 'appearance',
        title: 'Appearance',
        items: [
          { name: 'Edit Custom CSS', desc: 'Open custom.css in your editor. It is applied to Gmail in every account, and saving it applies the changes.', button: 'Open', run: () => window.mailbox.settingsAction('editCss') },
          { name: 'Reload Custom CSS', desc: 'Apply custom.css again now.', button: 'Reload', run: () => window.mailbox.settingsAction('reloadCss') },
        ],
      },
    ];
    let settingsSection = 'general';
    let lastState = null;

    function renderSettings(state) {
      lastState = state;
      document.body.classList.toggle('settings-open', state.settingsOpen);
      if (!state.settingsOpen) return;
      // Redrawing drops keyboard focus, so remember which control had it.
      const focused = document.activeElement?.dataset?.focusKey;
      const nav = document.getElementById('settings-nav');
      const pane = document.getElementById('settings-pane');
      nav.textContent = '';
      pane.textContent = '';
      for (const section of SETTINGS) {
        const b = el('button', section.id === settingsSection ? 'active' : '', section.title);
        b.dataset.focusKey = `nav:${section.id}`;
        b.onclick = () => {
          settingsSection = section.id;
          renderSettings(lastState);
        };
        nav.appendChild(b);
      }
      const section = SETTINGS.find((s) => s.id === settingsSection);
      pane.appendChild(el('h2', '', section.title));
      for (const item of section.items) {
        const row = el('div', 'setting');
        const text = el('div', 'text');
        text.appendChild(el('div', 'name', item.name));
        text.appendChild(el('div', 'desc', item.desc));
        row.appendChild(text);
        let control;
        if (item.key) {
          const on = Boolean(state.settings[item.key]);
          control = el('button', 'switch');
          control.setAttribute('role', 'switch');
          control.setAttribute('aria-checked', String(on));
          control.setAttribute('aria-label', item.name);
          control.onclick = () => window.mailbox.setSetting(item.key, !on);
        } else {
          control = el('button', 'action', item.button);
          control.setAttribute('aria-label', item.name);
          control.onclick = item.run;
        }
        control.dataset.focusKey = `item:${item.name}`;
        row.appendChild(control);
        pane.appendChild(row);
      }
      if (focused) [...document.querySelectorAll('#settings [data-focus-key]')].find((n) => n.dataset.focusKey === focused)?.focus();
    }

    function renderInbox(state) {
      document.body.classList.toggle('inbox-open', state.inboxOpen);
      if (!state.inboxOpen) return;
      const many = state.accounts.length > 1;
      note.textContent = many ? `Unread inbox mail across ${state.accounts.length} accounts` : 'Unread inbox mail';
      rows.textContent = '';
      if (state.inbox.length === 0) {
        rows.appendChild(el('div', '', 'No unread mail. Accounts that are not signed in yet do not appear here.')).id = 'empty';
        return;
      }
      for (const m of state.inbox) {
        const row = el('div', 'row');
        row.tabIndex = 0;
        const top = el('div', 'top');
        top.appendChild(el('span', 'from', m.from));
        if (many) top.appendChild(el('span', 'account', m.account));
        const time = el('span', 'time', formatTime(m.receivedAt));
        if (!many) time.style.marginLeft = 'auto';
        top.appendChild(time);
        row.appendChild(top);
        row.appendChild(el('div', 'subject', m.subject));
        if (m.summary) row.appendChild(el('div', 'summary', m.summary));
        const actions = el('div', 'actions');
        for (const [action, label] of ACTIONS) {
          const b = el('button', '', label);
          b.onclick = (e) => {
            e.stopPropagation();
            window.mailbox.mailAction(m.accountId, m.messageId, action);
          };
          actions.appendChild(b);
        }
        row.appendChild(actions);
        const open = () => window.mailbox.openMessage(m.accountId, m.messageId);
        row.onclick = open;
        row.onkeydown = (e) => {
          if (e.key === 'Enter' && e.target === row) open();
        };
        rows.appendChild(row);
      }
    }

    // Windows taskbar overlay: draw an amber badge with the total unread count and hand it to the main process.
    function drawOverlay(total) {
      if (!total) return window.mailbox.setOverlay(null, 0);
      const c = document.createElement('canvas');
      c.width = c.height = 32;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffb020';
      ctx.beginPath();
      ctx.arc(16, 16, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#101b3a';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(total > 99 ? '99+' : String(total), 16, 17);
      window.mailbox.setOverlay(c.toDataURL('image/png'), total);
    }

    let lastTotal = -1;
    function handle(state) {
      render(state);
      if (state.total !== lastTotal) {
        lastTotal = state.total;
        drawOverlay(state.total);
      }
    }

    window.mailbox.getState().then(handle);
    window.mailbox.onState(handle);
  </script>
</body>
</html>
